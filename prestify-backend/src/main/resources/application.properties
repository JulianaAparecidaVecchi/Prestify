spring.application.name=prestify-backend

server.port=${SERVER_PORT:8080}


# =========================
# BANCO DE DADOS
# =========================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/prestify?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo}

spring.datasource.username=${DB_USERNAME:root}

spring.datasource.password=${DB_PASSWORD:}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =========================
# JPA / HIBERNATE
# =========================

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}

spring.jpa.show-sql=${JPA_SHOW_SQL:false}

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false


# =========================
# DATA / HORA
# =========================

spring.jackson.time-zone=America/Sao_Paulo


# =========================
# JWT
# =========================

prestify.jwt.secret=${PRESTIFY_JWT_SECRET:prestify-development-secret-key-change-before-production-2026}

prestify.jwt.expiration=${PRESTIFY_JWT_EXPIRATION:28800}


# =========================
# LOGS
# =========================

logging.level.org.springframework.security=${SPRING_SECURITY_LOG_LEVEL:INFO}

# =========================
# CORS
# =========================

prestify.cors.allowed-origins=${PRESTIFY_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Token de recuperação somente para desenvolvimento local.
# Em produção: PRESTIFY_LOG_RESET_TOKEN=false
prestify.auth.log-reset-token=${PRESTIFY_LOG_RESET_TOKEN:true}

# Dados iniciais para desenvolvimento local.
# Em produção, mantenha PRESTIFY_INITIAL_DATA_ENABLED=false.
prestify.initial-data.enabled=${PRESTIFY_INITIAL_DATA_ENABLED:true}
prestify.initial-data.organization-name=${PRESTIFY_INITIAL_ORGANIZATION_NAME:Prestify Demo}
prestify.initial-data.owner-name=${PRESTIFY_INITIAL_OWNER_NAME:Administrador}
prestify.initial-data.owner-email=${PRESTIFY_INITIAL_OWNER_EMAIL:admin@prestify.com}
prestify.initial-data.owner-password=${PRESTIFY_INITIAL_OWNER_PASSWORD:Admin@123}